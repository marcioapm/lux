components:
  schemas:
    Artifact:
      additionalProperties: false
      properties:
        available:
          type: boolean
        contentType:
          type: string
        createdAt:
          format: date-time
          type: string
        epoch:
          format: int64
          type: integer
        id:
          type: string
        path:
          type: string
        sha256:
          type: string
        size:
          format: int64
          type: integer
      type: object
    ArtifactList:
      additionalProperties: false
      properties:
        artifacts:
          items:
            $ref: "#/components/schemas/Artifact"
          type:
            - array
            - "null"
      type: object
    Artifacts:
      additionalProperties: false
      properties:
        paths:
          items:
            type: string
          type:
            - array
            - "null"
      type: object
    Build:
      additionalProperties: false
      properties:
        args:
          additionalProperties:
            type: string
          type: object
        containerfile:
          type: string
        context:
          type: string
      type: object
    Capacity:
      additionalProperties: false
      properties:
        cpus:
          format: double
          type: number
        disk:
          format: int64
          type: integer
        memory:
          format: int64
          type: integer
        runs:
          format: int64
          type: integer
      type: object
    EgressRule:
      additionalProperties: false
      properties:
        cidr:
          type: string
        host:
          type: string
      type: object
    Error:
      additionalProperties: false
      properties:
        error:
          $ref: "#/components/schemas/ErrorInfo"
      type: object
    ErrorInfo:
      additionalProperties: false
      properties:
        code:
          description: Stable error code, e.g. not_found, invalid_spec, quota_exceeded.
          type: string
        details:
          description: Every problem, when there are several (invalid_spec, secrets_required, validation).
          items:
            type: string
          type:
            - array
            - "null"
        message:
          type: string
      type: object
    Event:
      additionalProperties: false
      properties:
        data:
          additionalProperties: {}
          type: object
        epoch:
          format: int64
          type: integer
        id:
          format: int64
          type: integer
        time:
          format: date-time
          type: string
        type:
          type: string
      type: object
    EventList:
      additionalProperties: false
      properties:
        events:
          items:
            $ref: "#/components/schemas/Event"
          type:
            - array
            - "null"
      type: object
    Git:
      additionalProperties: false
      properties:
        push:
          $ref: "#/components/schemas/Push"
        repositories:
          items:
            $ref: "#/components/schemas/Repository"
          type:
            - array
            - "null"
      type: object
    Host:
      additionalProperties: false
      properties:
        capacity:
          $ref: "#/components/schemas/Capacity"
        draining:
          type: boolean
        id:
          type: string
        labels:
          additionalProperties:
            type: string
          type: object
        lastHeartbeat:
          format: date-time
          type: string
        liveRuns:
          format: int64
          type: integer
        name:
          type: string
        platform:
          type: boolean
        pool:
          type: string
        providerId:
          type: string
        state:
          type: string
        stateReason:
          type: string
        times:
          additionalProperties:
            format: date-time
            type:
              - string
              - "null"
          type: object
        versions:
          additionalProperties: {}
          type: object
      type: object
    HostDrain:
      additionalProperties: false
      properties:
        draining:
          type: boolean
        host:
          description: The host's id.
          type: string
      type: object
    HostList:
      additionalProperties: false
      properties:
        hosts:
          items:
            $ref: "#/components/schemas/Host"
          type:
            - array
            - "null"
      type: object
    Image:
      additionalProperties: false
      properties:
        build:
          $ref: "#/components/schemas/Build"
        ref:
          type: string
      type: object
    ImageResolution:
      additionalProperties: false
      properties:
        containerfile:
          type: string
        imageId:
          type: string
      type: object
    Init:
      additionalProperties: false
      properties:
        script:
          type: string
      type: object
    InputRequest:
      additionalProperties: false
      properties:
        interrupt:
          description: Stop the current turn first.
          type: boolean
        raw:
          contentEncoding: base64
          description: Raw bytes for a generic workload's stdin.
          type: string
        requestId:
          description: "Makes retries safe: the runner delivers each id once. Generated if absent."
          type: string
        text:
          description: "A message: agents get it as a prompt, generic workloads on stdin."
          type: string
      type: object
    Manifest:
      additionalProperties: false
      properties:
        epoch:
          format: int64
          type: integer
        runId:
          type: string
        sessionId:
          type: string
        snapshotId:
          type: string
        volumes:
          items:
            $ref: "#/components/schemas/VolumeSnapshot"
          type:
            - array
            - "null"
      type: object
    Network:
      additionalProperties: false
      properties:
        egress:
          items:
            $ref: "#/components/schemas/EgressRule"
          type:
            - array
            - "null"
        ports:
          items:
            $ref: "#/components/schemas/Port"
          type:
            - array
            - "null"
        unrestricted:
          type: boolean
      type: object
    OutputEnd:
      additionalProperties: false
      properties:
        afterEvent:
          description: The last lifecycle event sent (afterEvent).
          format: int64
          type: integer
        cursor:
          description: Where to resume (since).
          type: string
        state:
          description: The Run's state.
          type: string
      type: object
    OutputError:
      additionalProperties: false
      properties:
        error:
          type: string
      type: object
    OutputGap:
      additionalProperties: false
      properties:
        epoch:
          format: int64
          type: integer
        reason:
          type: string
      type: object
    OutputRecord:
      additionalProperties: false
      properties:
        ch:
          type: string
        cursor:
          type: string
        data:
          type: string
        epoch:
          format: int64
          type: integer
        event: {}
        seq:
          format: int64
          type: integer
        t:
          format: int64
          type: integer
      type: object
    Placement:
      additionalProperties: false
      properties:
        pool:
          type: string
        prefers:
          additionalProperties:
            type: string
          type: object
        requires:
          additionalProperties:
            type: string
          type: object
      type: object
    Pool:
      additionalProperties: false
      properties:
        maxHosts:
          format: int64
          type: integer
        minHosts:
          format: int64
          type: integer
        name:
          type: string
        platform:
          type: boolean
        provider:
          type: string
        shared:
          type: boolean
        template:
          additionalProperties: {}
          type: object
        warmHosts:
          format: int64
          type: integer
      type: object
    PoolList:
      additionalProperties: false
      properties:
        pools:
          items:
            $ref: "#/components/schemas/Pool"
          type:
            - array
            - "null"
      type: object
    Port:
      additionalProperties: false
      properties:
        name:
          type: string
        port:
          format: int64
          type: integer
      type: object
    Push:
      additionalProperties: false
      properties:
        branch:
          type: string
      type: object
    PushRequest:
      additionalProperties: false
      properties:
        expect:
          additionalProperties:
            type: string
          description: Per repository name, the commit (full id) the push branch must be at for the push to go ahead.
          type: object
        requestId:
          description: Names the push in its git.push event. Generated if absent.
          type: string
      type: object
    Repository:
      additionalProperties: false
      properties:
        credential:
          type: string
        name:
          type: string
        path:
          type: string
        ref:
          type: string
        url:
          type: string
      type: object
    RequestAccepted:
      additionalProperties: false
      properties:
        requestId:
          type: string
      type: object
    Resources:
      additionalProperties: false
      properties:
        cpus:
          format: double
          type: number
        disk:
          description: "A number of bytes, or a size: \"8Gi\", \"512Mi\", \"1G\". Responses carry the number."
          oneOf:
            - format: int64
              type: integer
            - examples:
                - 8Gi
              type: string
        memory:
          description: "A number of bytes, or a size: \"8Gi\", \"512Mi\", \"1G\". Responses carry the number."
          oneOf:
            - format: int64
              type: integer
            - examples:
                - 8Gi
              type: string
        pids:
          format: int64
          type: integer
      type: object
    Resume:
      additionalProperties: false
      properties:
        command:
          items:
            type: string
          type:
            - array
            - "null"
      type: object
    ResumeInput:
      additionalProperties: false
      properties:
        text:
          type: string
      type: object
    ResumeRequest:
      additionalProperties: false
      properties:
        fromSnapshot:
          description: Resume from this snapshot instead of the latest (e.g. after lost).
          type: string
        input:
          $ref: "#/components/schemas/ResumeInput"
          description: A message for the workload once it is back.
        secrets:
          description: "A value for every one of the Run's secrets: luxd never keeps them."
          items:
            $ref: "#/components/schemas/Secret"
          type:
            - array
            - "null"
      type: object
    Run:
      additionalProperties: false
      properties:
        activity:
          type: string
        createdAt:
          format: date-time
          type: string
        epoch:
          format: int64
          type: integer
        exitCode:
          format: int64
          type: integer
        finishedAt:
          format: date-time
          type: string
        firstScheduledAt:
          format: date-time
          type: string
        firstStartedAt:
          format: date-time
          type: string
        host:
          type: string
        id:
          type: string
        image:
          $ref: "#/components/schemas/ImageResolution"
        labels:
          additionalProperties:
            type: string
          type: object
        name:
          type: string
        placements:
          items:
            $ref: "#/components/schemas/RunPlacement"
          type:
            - array
            - "null"
        secrets:
          items:
            $ref: "#/components/schemas/SecretRef"
          type:
            - array
            - "null"
        sessionId:
          type: string
        snapshotId:
          type: string
        spec:
          $ref: "#/components/schemas/RunSpec"
        state:
          type: string
        stateReason:
          type: string
        usage:
          $ref: "#/components/schemas/RunUsage"
      type: object
    RunList:
      additionalProperties: false
      properties:
        runs:
          items:
            $ref: "#/components/schemas/Run"
          type:
            - array
            - "null"
      type: object
    RunPlacement:
      additionalProperties: false
      properties:
        acceptedAt:
          format: date-time
          type: string
        assignedAt:
          format: date-time
          type: string
        containerStartedAt:
          format: date-time
          type: string
        cpuSeconds:
          format: double
          type: number
        epoch:
          format: int64
          type: integer
        exitCode:
          format: int64
          type: integer
        exitReason:
          type: string
        exitedAt:
          format: date-time
          type: string
        host:
          type: string
        hostName:
          type: string
        imageReadyAt:
          format: date-time
          type: string
        netRxBytes:
          format: int64
          type: integer
        netTxBytes:
          format: int64
          type: integer
        peakDiskBytes:
          format: int64
          type: integer
        peakMemoryBytes:
          format: int64
          type: integer
        peakPids:
          format: int64
          type: integer
        snapshotBytes:
          format: int64
          type: integer
        snapshotDoneAt:
          format: date-time
          type: string
        state:
          type: string
        stopReason:
          type: string
        stopRequestedAt:
          format: date-time
          type: string
        uploadedAt:
          format: date-time
          type: string
        volumesRestoredAt:
          format: date-time
          type: string
        workloadStartedAt:
          format: date-time
          type: string
      type: object
    RunSpec:
      additionalProperties: false
      properties:
        artifacts:
          $ref: "#/components/schemas/Artifacts"
        env:
          additionalProperties:
            type: string
          type: object
        git:
          $ref: "#/components/schemas/Git"
        image:
          $ref: "#/components/schemas/Image"
        init:
          $ref: "#/components/schemas/Init"
        labels:
          additionalProperties:
            type: string
          type: object
        name:
          type: string
        network:
          $ref: "#/components/schemas/Network"
        placement:
          $ref: "#/components/schemas/Placement"
        resources:
          $ref: "#/components/schemas/Resources"
          description: "What the Run gets, and the scheduler reserves on its host. Unset fields take luxd's defaults: cpus 2, memory 8Gi, pids 1024, unless its operator changed them (LUX_DEFAULT_CPUS, LUX_DEFAULT_MEMORY, LUX_DEFAULT_PIDS)."
        sandbox:
          $ref: "#/components/schemas/Sandbox"
        secrets:
          items:
            $ref: "#/components/schemas/Secret"
          type:
            - array
            - "null"
        timeout:
          description: A Go duration ("4h", "90s"), or a number of seconds. Responses carry the string.
          oneOf:
            - examples:
                - 4h
              type: string
            - type: number
        volumes:
          items:
            $ref: "#/components/schemas/Volume"
          type:
            - array
            - "null"
        workload:
          $ref: "#/components/schemas/Workload"
      type: object
    RunUsage:
      additionalProperties: false
      properties:
        cpuSeconds:
          format: double
          type: number
        netRxBytes:
          format: int64
          type: integer
        netTxBytes:
          format: int64
          type: integer
        peakDiskBytes:
          format: int64
          type: integer
        peakMemoryBytes:
          format: int64
          type: integer
        peakPids:
          format: int64
          type: integer
        placements:
          format: int64
          type: integer
        queueSeconds:
          format: double
          type: number
      type: object
    Sandbox:
      additionalProperties: false
      properties:
        nestedContainers:
          type: boolean
        readOnlyRoot:
          type: boolean
      type: object
    Secret:
      additionalProperties: false
      properties:
        as:
          type: string
        name:
          type: string
        path:
          type: string
        runnerOnly:
          type: boolean
        value:
          type: string
      type: object
    SecretRef:
      additionalProperties: false
      properties:
        fingerprint:
          type: string
        name:
          type: string
      type: object
    Snapshot:
      additionalProperties: false
      properties:
        available:
          type: boolean
        createdAt:
          format: date-time
          type: string
        epoch:
          format: int64
          type: integer
        id:
          type: string
        manifest:
          $ref: "#/components/schemas/Manifest"
        onHost:
          type: string
        uploaded:
          type: boolean
      type: object
    SnapshotList:
      additionalProperties: false
      properties:
        snapshots:
          items:
            $ref: "#/components/schemas/Snapshot"
          type:
            - array
            - "null"
      type: object
    StatusBody:
      additionalProperties: false
      properties:
        status:
          examples:
            - ok
          type: string
      type: object
    StreamData:
      additionalProperties: false
      properties:
        ch:
          type: string
        cols:
          format: int64
          type: integer
        data:
          contentEncoding: base64
          type: string
        eof:
          type: boolean
        error:
          type: string
        exitCode:
          format: int64
          type: integer
        rows:
          format: int64
          type: integer
      type: object
    StreamOpen:
      additionalProperties: false
      properties:
        cols:
          format: int64
          type: integer
        command:
          items:
            type: string
          type:
            - array
            - "null"
        kind:
          type: string
        port:
          format: int64
          type: integer
        rows:
          format: int64
          type: integer
        streamId:
          type: string
        tty:
          type: boolean
      type: object
    Volume:
      additionalProperties: false
      properties:
        kind:
          type: string
        name:
          type: string
        path:
          type: string
      type: object
    VolumeSnapshot:
      additionalProperties: false
      properties:
        blobId:
          type: string
        name:
          type: string
        path:
          type: string
        sha256:
          type: string
        size:
          format: int64
          type: integer
      type: object
    Workload:
      additionalProperties: false
      properties:
        adapter:
          type: string
        command:
          items:
            type: string
          type:
            - array
            - "null"
        grace:
          description: A Go duration ("4h", "90s"), or a number of seconds. Responses carry the string.
          oneOf:
            - examples:
                - 4h
              type: string
            - type: number
        prompt:
          type: string
        resume:
          $ref: "#/components/schemas/Resume"
        tty:
          type: boolean
        user:
          type: string
        workdir:
          type: string
      type: object
  securitySchemes:
    apiKey:
      description: A tenant API key (luxd admin create-key).
      scheme: bearer
      type: http
info:
  description: |-
    The lux tenant API. Every /v1 call authenticates with an API key (`Authorization: Bearer <key>`); a key has scopes `read`, `run` and `admin`, each implying the ones before it.

    Errors are JSON: `{"error": {"code": "not_found", "message": "...", "details": ["..."]}}`, with a stable `code`.
  title: lux
  version: dev
openapi: 3.1.0
paths:
  /health:
    get:
      operationId: health
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusBody"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: Check luxd is up
  /v1/artifacts/{aid}:
    get:
      description: |-
        The file the Run wrote, streamed through luxd. Content-Length and X-Lux-SHA256 let a client tell a whole download from one cut short (the response is aborted, never ended cleanly, on a failure mid-way). 409 not_uploaded (with Retry-After) while it is still on its host; 410 gone once deleted by retention.

        Needs the `read` scope.
      operationId: downloadArtifact
      parameters:
        - description: The artifact's id.
          in: path
          name: aid
          required: true
          schema:
            description: The artifact's id.
            type: string
      responses:
        "200":
          content:
            application/octet-stream:
              schema:
                contentMediaType: application/octet-stream
                format: binary
                type: string
          description: The file.
          headers:
            Content-Disposition:
              description: attachment, with the file's name.
              schema:
                type: string
            Content-Length:
              description: The file's size.
              schema:
                type: integer
            X-Lux-SHA256:
              description: The file's SHA-256, hex.
              schema:
                type: string
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Conflict
        "410":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Gone
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unprocessable Entity
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Internal Server Error
      security:
        - apiKey: []
      summary: Download an artifact
      tags:
        - runs
  /v1/hosts:
    get:
      description: |-
        The tenant's own hosts, and platform hosts in pools it can use.

        Needs the `read` scope.
      operationId: listHosts
      parameters:
        - description: true to include terminated hosts.
          explode: false
          in: query
          name: all
          schema:
            description: true to include terminated hosts.
            examples:
              - "true"
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostList"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Forbidden
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unprocessable Entity
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Internal Server Error
      security:
        - apiKey: []
      summary: List hosts
      tags:
        - hosts
  /v1/hosts/{id}/drain:
    post:
      description: |-
        No new placements; its live Runs are stopped and resumed elsewhere. Only the tenant's own hosts.

        Needs the `admin` scope.
      operationId: drainHost
      parameters:
        - description: The host's id or name.
          in: path
          name: id
          required: true
          schema:
            description: The host's id or name.
            type: string
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostDrain"
          description: Accepted
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Not Found
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unprocessable Entity
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Internal Server Error
      security:
        - apiKey: []
      summary: Drain a host
      tags:
        - hosts
  /v1/pools:
    get:
      description: |-
        The tenant's pools and the platform pools it can use.

        Needs the `read` scope.
      operationId: listPools
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PoolList"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Forbidden
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Internal Server Error
      security:
        - apiKey: []
      summary: List pools
      tags:
        - pools
    post:
      description: Needs the `admin` scope.
      operationId: putPool
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Pool"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pool"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Forbidden
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unprocessable Entity
        "500":
          content:
            application/json:
